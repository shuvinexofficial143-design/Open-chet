name: Web checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/mobile-back.spec.ts --project=mobile
      - run: npx playwright test tests/remove-tools.spec.ts --project=mobile --project=desktop
      - run: npx playwright test tests/chat-media.spec.ts --project=mobile --project=desktop
      - run: npx playwright test tests/inbox-customer-header.spec.ts --project=mobile --project=desktop
      - run: npx playwright test tests/blue-wave-ui.spec.ts --project=mobile --project=desktop
      - run: npx playwright test tests/customer-threads.spec.ts --project=mobile --project=desktop
      - run: npx playwright test tests/mobile-compact-contact-removal.spec.ts --project=mobile --project=desktop
